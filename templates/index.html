<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Jukebox (Picard Edition)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem 0; margin-bottom: 2rem; border-radius: 0 0 1rem 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hero h1 { font-weight: 700; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="hero text-center">
        <div class="container">
            <h1>🎵 Jukebox Picard</h1>
            <p class="lead mb-0">Scarica e smista in /music/picard</p>
        </div>
    </div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <form action="/submit" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Link YouTube o Titolo</label>
                                <input type="text" name="url" class="form-control form-control-lg" placeholder="Es. https://www.youtube.com/watch?v=..." required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">⬇️ Scarica Brano</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
